<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4c5c"/>
      <stop offset="1" stop-color="#093542"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f7"/>
      <stop offset="1" stop-color="#d7dde0"/>
    </linearGradient>
  </defs>

  <!-- app icon background -->
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- advertisement broadcast waves -->
  <g fill="none" stroke="#f4a340" stroke-width="9" stroke-linecap="round">
    <path d="M182 58 A22 22 0 0 1 204 80"/>
    <path d="M182 38 A42 42 0 0 1 224 80"/>
  </g>

  <!-- sensor body -->
  <rect x="48" y="80" width="136" height="128" rx="18" fill="url(#body)" stroke="#093542" stroke-width="4"/>

  <!-- display -->
  <rect x="64" y="96" width="104" height="70" rx="8" fill="#0f4c5c"/>
  <!-- thermometer glyph -->
  <rect x="88" y="106" width="12" height="38" rx="6" fill="none" stroke="#7fd8c4" stroke-width="3"/>
  <rect x="92" y="122" width="4" height="24" fill="#7fd8c4"/>
  <circle cx="94" cy="150" r="8" fill="#7fd8c4"/>
  <!-- humidity droplet glyph -->
  <path d="M138 108 C134 116 126 126 126 136 a12 12 0 0 0 24 0 C150 126 142 116 138 108 z" fill="#7fd8c4"/>

  <!-- status LED / button -->
  <circle cx="116" cy="187" r="7" fill="none" stroke="#093542" stroke-width="4"/>
  <circle cx="116" cy="187" r="2.5" fill="#093542"/>
</svg>
